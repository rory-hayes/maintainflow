name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Verify application
        run: npm run verify

      - name: Install browsers for acceptance
        run: npx playwright install --with-deps chromium webkit

      - name: Check official OpenAI Ads contract drift
        run: npm run check:openai-ads-contract

      - name: Build production container
        run: |
          docker build \
            --build-arg MAINTAINFLOW_BUILD_SHA=${{ github.sha }} \
            --tag maintainflow-ads:ci \
            .
          docker build \
            --build-arg MAINTAINFLOW_BUILD_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_bWFpbnRhaW5mbG93LWNpLmNsZXJrLmFjY291bnRzLmRldiQ= \
            --tag maintainflow-ads:private-read-ci \
            .

      - name: Smoke-test production container, database readiness, and revision
        run: |
          set -euo pipefail
          ci_cert_dir="$RUNNER_TEMP/maintainflow-postgres-tls"
          ci_network="maintainflow-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker logs maintainflow-ads-ci || true
            docker logs maintainflow-ads-private-read-ci || true
            docker logs maintainflow-ads-config-mismatch-ci || true
            docker logs maintainflow-postgres-ci || true
            docker rm --force maintainflow-ads-ci || true
            docker rm --force maintainflow-ads-private-read-ci || true
            docker rm --force maintainflow-ads-config-mismatch-ci || true
            docker rm --force maintainflow-postgres-ci || true
            docker network rm "$ci_network" || true
          }
          trap cleanup EXIT

          mkdir -p "$ci_cert_dir"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$ci_cert_dir/ca.key" \
            -out "$ci_cert_dir/ca.crt" \
            -subj "/CN=MaintainFlow CI CA"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "$ci_cert_dir/server.key" \
            -out "$ci_cert_dir/server.csr" \
            -subj "/CN=postgres" \
            -addext "subjectAltName=DNS:postgres,DNS:localhost,IP:127.0.0.1"
          openssl x509 -req -sha256 -days 1 \
            -in "$ci_cert_dir/server.csr" \
            -CA "$ci_cert_dir/ca.crt" \
            -CAkey "$ci_cert_dir/ca.key" \
            -CAcreateserial \
            -copy_extensions copy \
            -out "$ci_cert_dir/server.crt"
          postgres_uid="$(docker run --rm postgres:17 id -u postgres)"
          postgres_gid="$(docker run --rm postgres:17 id -g postgres)"
          chmod 600 "$ci_cert_dir/server.key"
          sudo chown "$postgres_uid:$postgres_gid" \
            "$ci_cert_dir/server.key" "$ci_cert_dir/server.crt"

          docker network create "$ci_network"
          docker run --detach --name maintainflow-postgres-ci \
            --network "$ci_network" --network-alias postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=maintainflow \
            --env POSTGRES_PASSWORD=maintainflow \
            --env POSTGRES_DB=maintainflow \
            --volume "$ci_cert_dir:/tls:ro" \
            postgres:17 \
            -c ssl=on \
            -c ssl_cert_file=/tls/server.crt \
            -c ssl_key_file=/tls/server.key
          postgres_ready=false
          for _attempt in {1..30}; do
            if docker exec \
              --env PGPASSWORD=maintainflow \
              --env PGSSLMODE=verify-full \
              --env PGSSLROOTCERT=/tls/ca.crt \
              maintainflow-postgres-ci \
              psql --host 127.0.0.1 \
                --username maintainflow \
                --dbname maintainflow \
                --no-psqlrc \
                --set ON_ERROR_STOP=1 \
                --tuples-only --no-align \
                --command 'SELECT 1' | grep --quiet --line-regexp '1'; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          test "$postgres_ready" = "true"

          NODE_EXTRA_CA_CERTS="$ci_cert_dir/ca.crt" \
            DATABASE_URL='postgres://maintainflow:maintainflow@localhost:5432/maintainflow?sslmode=verify-full' \
            MAINTAINFLOW_APPLY_DATABASE_MIGRATIONS=true \
            npm run db:migrate

          docker run --detach --name maintainflow-ads-ci --publish 3000:3000 \
            --network "$ci_network" \
            --volume "$ci_cert_dir/ca.crt:/tls/ca.crt:ro" \
            --env NODE_EXTRA_CA_CERTS=/tls/ca.crt \
            --env MAINTAINFLOW_BUILD_SHA=0000000000000000000000000000000000000000 \
            --env MAINTAINFLOW_RELEASE_STAGE=demo \
            --env OPENAI_ADS_DATA_MODE=demo \
            --env OPENAI_ADS_LIVE_WRITES_ENABLED=false \
            --env OPENAI_CONVERSIONS_VALIDATE_ONLY_ENABLED=false \
            --env MAINTAINFLOW_APP_ORIGIN=https://maintainflow.test \
            --env MAINTAINFLOW_LEGAL_ENTITY_NAME="MaintainFlow CI" \
            --env MAINTAINFLOW_PRIVACY_CONTACT_EMAIL=privacy@maintainflow.io \
            --env MAINTAINFLOW_SUPPORT_CONTACT_EMAIL=support@maintainflow.io \
            --env DATABASE_URL='postgres://maintainflow:maintainflow@postgres:5432/maintainflow?sslmode=verify-full' \
            --env CRON_SECRET=cccccccccccccccccccccccccccccccc \
            --env READINESS_RATE_LIMIT_SECRET=rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr \
            --env MAINTAINFLOW_READINESS_PROBE_SECRET=pppppppppppppppppppppppppppppppp \
            --env MAINTAINFLOW_ADMISSION_MODE=private_beta \
            --env MAINTAINFLOW_PUBLIC_SIGN_UP_ENABLED=false \
            maintainflow-ads:ci
          app_ready=false
          for _attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > health.json; then
              app_ready=true
              break
            fi
            sleep 1
          done
          test "$app_ready" = "true"
          node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('health.json','utf8')); if (!value.ok || value.scope !== 'process_liveness' || value.revision !== process.env.GITHUB_SHA) process.exit(1);"

          unauthorized_status="$(curl --silent --output unauthorized-ready.json \
            --write-out '%{http_code}' http://127.0.0.1:3000/api/ready)"
          test "$unauthorized_status" = "401"
          dependencies_ready=false
          for _attempt in {1..20}; do
            if curl --fail --silent \
              --header 'Authorization: Bearer pppppppppppppppppppppppppppppppp' \
              http://127.0.0.1:3000/api/ready > ready.json; then
              dependencies_ready=true
              break
            fi
            sleep 1
          done
          test "$dependencies_ready" = "true"
          node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('ready.json','utf8')); if (!value.ok || value.scope !== 'deployment_readiness' || value.stage !== 'demo' || value.revision !== process.env.GITHUB_SHA || value.checks.passed !== value.checks.total || value.checks.total < 5) process.exit(1);"

          CI=true \
            MAINTAINFLOW_PROBE_ALLOW_INSECURE_LOOPBACK=true \
            MAINTAINFLOW_PROBE_ORIGIN=http://127.0.0.1:3000 \
            MAINTAINFLOW_EXPECTED_BUILD_SHA="$GITHUB_SHA" \
            MAINTAINFLOW_EXPECTED_RELEASE_STAGE=demo \
            MAINTAINFLOW_READINESS_PROBE_SECRET=pppppppppppppppppppppppppppppppp \
            CRON_SECRET=cccccccccccccccccccccccccccccccc \
            npm run probe:deployment

          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 \
            PLAYWRIGHT_EXPECTED_PRIVACY_CONTACT_EMAIL=privacy@maintainflow.io \
            PLAYWRIGHT_EXPECTED_SUPPORT_CONTACT_EMAIL=support@maintainflow.io \
            npm run test:e2e

          docker rm --force maintainflow-ads-ci
          docker run --detach --name maintainflow-ads-private-read-ci \
            --publish 3000:3000 \
            --network "$ci_network" \
            --volume "$ci_cert_dir/ca.crt:/tls/ca.crt:ro" \
            --env NODE_EXTRA_CA_CERTS=/tls/ca.crt \
            --env MAINTAINFLOW_BUILD_SHA=0000000000000000000000000000000000000000 \
            --env MAINTAINFLOW_RELEASE_STAGE=private_read \
            --env OPENAI_ADS_DATA_MODE=live \
            --env OPENAI_ADS_LIVE_WRITES_ENABLED=false \
            --env OPENAI_CONVERSIONS_VALIDATE_ONLY_ENABLED=false \
            --env MAINTAINFLOW_APP_ORIGIN=https://maintainflow.test \
            --env MAINTAINFLOW_LEGAL_ENTITY_NAME="MaintainFlow CI" \
            --env MAINTAINFLOW_PRIVACY_CONTACT_EMAIL=privacy@maintainflow.io \
            --env MAINTAINFLOW_SUPPORT_CONTACT_EMAIL=support@maintainflow.io \
            --env DATABASE_URL='postgres://maintainflow:maintainflow@postgres:5432/maintainflow?sslmode=verify-full' \
            --env CRON_SECRET=cccccccccccccccccccccccccccccccc \
            --env READINESS_RATE_LIMIT_SECRET=rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr \
            --env MAINTAINFLOW_READINESS_PROBE_SECRET=pppppppppppppppppppppppppppppppp \
            --env MAINTAINFLOW_ADMISSION_MODE=private_beta \
            --env MAINTAINFLOW_PUBLIC_SIGN_UP_ENABLED=false \
            --env MAINTAINFLOW_PRIVATE_BETA_OPERATOR_IDS=user_ci \
            --env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_bWFpbnRhaW5mbG93LWNpLmNsZXJrLmFjY291bnRzLmRldiQ= \
            --env CLERK_SECRET_KEY=sk_test_maintainflow_ci_only \
            --env MAINTAINFLOW_ACTIVE_CREDENTIAL_KEY_ID=ci \
            --env 'MAINTAINFLOW_CREDENTIAL_KEYRING={"ci":"Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M="}' \
            maintainflow-ads:private-read-ci
          private_read_ready=false
          for _attempt in {1..20}; do
            if curl --fail --silent \
              --header 'Authorization: Bearer pppppppppppppppppppppppppppppppp' \
              http://127.0.0.1:3000/api/ready > private-read-ready.json; then
              private_read_ready=true
              break
            fi
            sleep 1
          done
          test "$private_read_ready" = "true"
          node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('private-read-ready.json','utf8')); if (!value.ok || value.stage !== 'private_read' || value.revision !== process.env.GITHUB_SHA || value.checks.passed !== value.checks.total || value.checks.total < 12) process.exit(1);"

          docker rm --force maintainflow-ads-private-read-ci
          docker run --detach --name maintainflow-ads-config-mismatch-ci \
            --network "$ci_network" \
            --volume "$ci_cert_dir/ca.crt:/tls/ca.crt:ro" \
            --env NODE_EXTRA_CA_CERTS=/tls/ca.crt \
            --env MAINTAINFLOW_RELEASE_STAGE=private_read \
            --env OPENAI_ADS_DATA_MODE=live \
            --env OPENAI_ADS_LIVE_WRITES_ENABLED=false \
            --env OPENAI_CONVERSIONS_VALIDATE_ONLY_ENABLED=false \
            --env MAINTAINFLOW_APP_ORIGIN=https://maintainflow.test \
            --env MAINTAINFLOW_LEGAL_ENTITY_NAME="MaintainFlow CI" \
            --env MAINTAINFLOW_PRIVACY_CONTACT_EMAIL=privacy@maintainflow.io \
            --env MAINTAINFLOW_SUPPORT_CONTACT_EMAIL=support@maintainflow.io \
            --env DATABASE_URL='postgres://maintainflow:maintainflow@postgres:5432/maintainflow?sslmode=verify-full' \
            --env CRON_SECRET=cccccccccccccccccccccccccccccccc \
            --env READINESS_RATE_LIMIT_SECRET=rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr \
            --env MAINTAINFLOW_READINESS_PROBE_SECRET=pppppppppppppppppppppppppppppppp \
            --env MAINTAINFLOW_ADMISSION_MODE=private_beta \
            --env MAINTAINFLOW_PUBLIC_SIGN_UP_ENABLED=false \
            --env MAINTAINFLOW_PRIVATE_BETA_OPERATOR_IDS=user_ci \
            --env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_bWlzbWF0Y2guY2xlcmsuYWNjb3VudHMuZGV2JA== \
            --env CLERK_SECRET_KEY=sk_test_maintainflow_ci_only \
            --env MAINTAINFLOW_ACTIVE_CREDENTIAL_KEY_ID=ci \
            --env 'MAINTAINFLOW_CREDENTIAL_KEYRING={"ci":"Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M="}' \
            maintainflow-ads:private-read-ci
          mismatch_refused=false
          for _attempt in {1..20}; do
            if test "$(docker inspect --format '{{.State.Running}}' maintainflow-ads-config-mismatch-ci)" = "false"; then
              mismatch_refused=true
              break
            fi
            sleep 1
          done
          test "$mismatch_refused" = "true"
          test "$(docker inspect --format '{{.State.ExitCode}}' maintainflow-ads-config-mismatch-ci)" -ne 0
          docker logs maintainflow-ads-config-mismatch-ci 2>&1 \
            | grep --fixed-strings 'Runtime NEXT_PUBLIC Clerk configuration does not match'

  database:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database migrations and stores
        run: npm run test:db
        env:
          MAINTAINFLOW_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
