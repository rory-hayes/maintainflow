name: OpenAI Ads contract watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: openai-ads-contract-watch
  cancel-in-progress: true

jobs:
  contract-drift:
    name: Compare official OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify the drift checker itself
        run: npm run test:openai-ads-contract-checker

      - name: Compare the reviewed manifest with OpenAI
        run: npm run check:openai-ads-contract
